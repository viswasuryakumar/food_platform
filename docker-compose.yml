version: '3.8'

services:
  # 1. User Service
  user:
    build: ./services/user-service
    ports:
      - "3001:3001"
    env_file: ./services/user-service/.env
    environment:
      - PORT=3001

  # 2. Restaurant Service
  restaurant:
    build: ./services/restaurant-service
    ports:
      - "3002:3002"
    env_file: ./services/restaurant-service/.env
    environment:
      - PORT=3002

  # 3. Order Service
  order:
    build: ./services/order-service
    ports:
      - "3003:3003"
    env_file: ./services/order-service/.env
    environment:
      - PORT=3003

  # 4. Payment Service
  payment:
    build: ./services/payment-service
    ports:
      - "3004:3004"
    env_file: ./services/payment-service/.env
    environment:
      - PORT=3004

  # 5. Notification Service
  notification:
    build: ./services/notification-service
    ports:
      - "3005:3005"
    env_file: ./services/notification-service/.env
    environment:
      - PORT=3005

  # 6. AI Agent Service
  ai:
    build: ./services/ai-agent
    ports:
      - "8000:8000"
    env_file: ./services/ai-agent/.env

  # 7. API Gateway
  gateway:
    build: ./api-gateway
    ports:
      - "3000:3000"
    env_file: ./api-gateway/.env
    environment:
      - PORT=3000
      - USER_SERVICE_URL=http://user:3001
      - RESTAURANT_SERVICE_URL=http://restaurant:3002
      - ORDER_SERVICE_URL=http://order:3003
      - PAYMENT_SERVICE_URL=http://payment:3004
      - NOTIFICATION_SERVICE_URL=http://notification:3005
    depends_on:
      - user
      - restaurant
      - order
      - payment
      - notification

  # 8. Frontend (Development Mode)
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - gateway
